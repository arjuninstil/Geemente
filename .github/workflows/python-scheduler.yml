name: Run Python Script Every 8 Minutes

on:
  schedule:
    # Runs every 8 minutes
    - cron: "*/8 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      # Map repository secrets into environment variables expected by the script
      # Add these secrets in your repository settings -> Secrets
      TOKEN: ${{ secrets.TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python script
        run: python date_checker.py
